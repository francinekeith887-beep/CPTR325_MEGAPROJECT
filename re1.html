<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Requirement 1 - Domain Controller | CPTR 325</title>

  <style>

    :root {
      --primary-color: #1a1a1a;
      --primary-dark: #2c2c2c;
      --secondary-color: #3d3d3d;
      --accent-color: #8a8a8a;

      --text-light: #ffffff;
      --surface: #ffffff;
      --border-color: #d4d2cd;

      --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.18);

      --radius-lg: 28px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:"Inter",sans-serif;
      background:
      linear-gradient(
      135deg,
      var(--primary-color),
      var(--primary-dark),
      var(--secondary-color)),
      url('bg2.jpg');

      background-size:cover;
      background-position:center;
      background-attachment:fixed;

      color:var(--text-light);
      line-height:1.7;
      min-height:100vh;
      padding:3rem 5%;
    }

    /* NAVBAR */

    .navbar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      padding:18px 6%;

      display:flex;
      justify-content:space-between;
      align-items:center;

      background:rgba(28,28,28,0.95);

      backdrop-filter:blur(10px);

      border-bottom:
      1px solid rgba(255,255,255,0.1);

      z-index:1000;
    }

    .logo{
      font-size:1.4rem;
      font-weight:700;
      color:var(--text-light);
      letter-spacing:1px;
    }

    .home-btn{
      text-decoration:none;
      color:var(--text-light);

      font-weight:600;
      font-size:0.95rem;

      padding:0.45rem 1.1rem;

      border-radius:8px;

      border:
      1px solid rgba(255,255,255,0.2);

      background:
      rgba(255,255,255,0.08);

      transition:all 0.25s ease;
    }

    .home-btn:hover{
      background:
      rgba(255,255,255,0.18);

      transform:translateY(-1px);
    }

    /* TITLE */

    .page-title{
      text-align:center;
      margin-top:6rem;
      margin-bottom:2.5rem;
    }

    h1{
      font-size:2.75rem;
      font-weight:800;

      background:white;

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    h4{
      color:var(--accent-color);

      font-size:1.5rem;
      font-weight:700;

      margin-bottom:1rem;

      padding-left:1rem;

      border-left:
      4px solid var(--accent-color);
    }

    /* MAIN LAYOUT */

    .doc-template{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:3rem;
      align-items:start;
      margin-left: 10rem;
      margin-bottom:3rem;
      margin-top:5rem;
    }

    .doc-image{
      width:100%;
      max-width:600px;
      margin-left: -10rem;
      margin-bottom: 5rem;
      border-radius:var(--radius-lg);

      box-shadow:var(--shadow-lg);

      display:block;


      transition:0.3s ease;
    }

    .doc-image:hover{
      box-shadow:0 0 25px var(--accent-color);
    }

    /* STEP LIST */

    .step-list{
      list-style:none;
      counter-reset:step-counter;
      position:relative;
    }

    .step-list::before{
      content:'';

      position:absolute;

      left:18px;
      top:0;
      bottom:0;

      width:2px;

      background:
      rgba(255,255,255,0.15);
    }

    .step-list li{

      counter-increment:step-counter;

      display:flex;
      align-items:flex-start;

      gap:1rem;

      margin-bottom:1rem;

      position:relative;

      font-size:0.95rem;
    }

    .step-list li::before{

      content:counter(step-counter);

      min-width:36px;
      height:36px;

      border-radius:6px;

      background:
      rgba(255,255,255,0.12);

      border:
      1px solid rgba(255,255,255,0.25);

      display:flex;
      align-items:center;
      justify-content:center;

      font-weight:700;
      font-size:0.8rem;
    }

    /* BUTTONS */

    .btn-group{
      display:flex;
      gap:1rem;

      justify-content:center;

      margin-top:3rem;

      flex-wrap:wrap;
    }

    .btn{
      background:
      linear-gradient(
      135deg,
      var(--accent-color),
      var(--secondary-color));

      color:var(--text-light);

      padding:1rem 2.2rem;

      border-radius:var(--radius-lg);

      font-weight:800;

      text-transform:uppercase;

      letter-spacing:1px;

      text-decoration:none;

      border:2px solid var(--surface);

      box-shadow:var(--shadow-lg);

      transition:all 0.3s ease;
    }

    .btn:hover{

      transform:
      translateY(-4px)
      scale(1.05);

      background:
      linear-gradient(
      135deg,
      var(--secondary-color),
      var(--accent-color));

      box-shadow:
      0 0 25px var(--accent-color);
    }

    /* PAGE ANIMATION */

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fadeOut{
      to{
        opacity:0;
        transform:translateY(-10px);
      }
    }

    .page-content{
      animation:fadeIn 0.25s ease both;
    }

    .page-content.fade-out{
      animation:fadeOut 0.2s ease forwards;
    }

    /* /* RESPONSIVE */ 

    @media(max-width:768px){

      .doc-template{
        grid-template-columns:1fr;
      }

      h1{
        font-size:2rem;
      }

    }

  </style>

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">

    <div class="logo">
      CPTR 325
    </div>

    <a href="home.html" class="home-btn">
      🏠 Home
    </a>

  </nav>

  <!-- PAGE CONTENT -->

  <div class="page-content">

    <!-- TITLE -->

    <div class="page-title">

      <h1>
        Requirement 1:
        Domain Controller Setup
      </h1>

    </div>

    <!-- MAIN CONTENT -->

    <div class="doc-template">

      <div>

        <h4>
          Step-by-Step Procedure:
        </h4>

        <ol class="step-list">

          <li>
            Server Manager → Add Roles → Active Directory DS
          </li>

          <li>
            Run DCPROMO → Create domain group2.local
          </li>

          <li>
            Configure DNS integration
          </li>

          <li>
            Restart server
          </li>

        </ol>

      </div>

      <div>

        <img
        src="2..jpg"
        alt="DCPROMO Wizard"
        class="doc-image">

      </div>

    </div>

    <!-- BUTTONS -->

    <div class="btn-group">

      <a href="home.html" class="btn">
        Back
      </a>

      <a href="https://youtu.be/QdbLn5-H_o4" target="_blank" rel="noopener noreferrer" class="btn">Watch Here</a>

      <a href="re2.html" class="btn">
        Requirement 2 →
      </a>

    </div>

  </div>

  <!-- VIDEO MODAL -->

  </div>

  <!-- JAVASCRIPT -->

  <script>

    document
    .querySelectorAll(".btn")
    .forEach(btn => {

      if(!btn.hasAttribute("onclick")){

        btn.addEventListener("click", e => {

          e.preventDefault();

          const href =
          btn.getAttribute("href");

          document
          .querySelector(".page-content")
          .classList.add("fade-out");

          setTimeout(() => {

            location.href = href;

          }, 200);

        });

      }

    });

    </script>

</body>
</html>
